<main>

<h2>Contact Us</h2>
<p>Have a question? Send us a message.</p>

<!-- validateForm() checks the form before it is sent -->
<form onsubmit="return validateForm()">
<table class="contact-form" border="0">
<tr>
<td>Name</td>
<td><input type="text" id="name"></td>
</tr>
<tr>
<td>Email</td>
<td><input type="email" id="email"></td>
</tr>
<tr>
<td>Message</td>
<td><textarea id="message" rows="5"></textarea></td>
</tr>
<tr>
<td></td>
<td><input type="submit" value="Send Message" class="button"></td>
</tr>
</table>
</form>

<p id="form-result"></p>

</main>

updateCartCount();
